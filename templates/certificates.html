<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Certificate</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Georgia, serif;
            background: #f4f1ea;
        }

        .certificate {
            width: 1000px;
            height: 700px;
            margin: 40px auto;
            background: white;
            border: 12px solid #1f3c5b;
            box-sizing: border-box;
            text-align: center;
            padding: 70px;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #1f3c5b;
        }

        .subtitle {
            margin-top: 25px;
            font-size: 22px;
            color: #555;
        }

        .recipient {
            margin: 35px 0;
            font-size: 42px;
            font-weight: bold;
            color: #222;
        }

        .description {
            font-size: 21px;
            color: #444;
        }

        .event {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #1f3c5b;
        }

        .date {
            margin-top: 55px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="certificate">

        <div class="title">
            CERTIFICATE OF PARTICIPATION
        </div>

        <div class="subtitle">
            This certificate is proudly presented to
        </div>

        <div class="recipient">
            {{ recipient_name }}
        </div>

        <div class="description">
            for successfully participating in
        </div>

        <div class="event">
            {{ event_name }}
        </div>

        <div class="date">
            Date: {{ date }}
        </div>

    </div>

</body>
</html>
